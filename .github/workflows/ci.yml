name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g opencode-ai@1.18.30
      - run: npm run lint
      # `pretest` builds dist/, which every later step reuses.
      - run: npm test
        env:
          AIAND_API_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.AIAND_API_KEY || '' }}
      # The live e2e (test/e2e-live.test.mjs) runs inside `npm test` above
      # with the same key (pushes and same-repo PRs) and skips itself without
      # key+binary (fork PRs stay green). A fork push whose key has no credits also skips; official
      # main still fails on that. No continue-on-error step.
      - run: node scripts/e2e.mjs
      # Offline subset of the sandbox matrix: no key, no network.
      - run: node scripts/sbx-test.mjs --smoke dist/index.js
      - run: npm run check:dist
      - run: npm run check:public
  # Full live matrix against the real gateway: pasted-key login, whoami,
  # status, run, models, usage, orgs, config, logout, `opencode on/status/off`,
  # `restore --force`, `init`, and the `run-agent` launcher, all in a fresh
  # temp state dir. Needs the AIAND_API_KEY secret, so it runs on pushes to
  # main and on PRs from branches of this repository (fork PRs get no
  # secrets and skip). Spends a few cents of credit per run.
  live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: live-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # sbx-test plants its own stub agent binaries; the real opencode run is
      # test/e2e-live.test.mjs in the build job.
      - run: node scripts/sbx-test.mjs dist/index.js
        env:
          AIAND_API_KEY: ${{ secrets.AIAND_API_KEY }}
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install into an isolated HOME from the checkout itself (no network
      # clone: AIAND_SOURCE points at actions/checkout's copy) and assert
      # the launcher reports this PR's package.json version.
      - run: |
          set -euo pipefail
          export ISOLATED_HOME="$RUNNER_TEMP/aiand-install-home"
          mkdir -p "$ISOLATED_HOME"
          HOME="$ISOLATED_HOME" AIAND_SOURCE="$GITHUB_WORKSPACE" AIAND_NO_MODIFY_PATH=1 bash "$GITHUB_WORKSPACE/install.sh"
          expected="$(node -p "require('./package.json').version")"
          actual="$(HOME="$ISOLATED_HOME" "$ISOLATED_HOME/.local/bin/aiand" --version)"
          test "$actual" = "$expected" || { echo "aiand --version '$actual' != package.json '$expected'"; exit 1; }
          for rc in "$ISOLATED_HOME/.bashrc" "$ISOLATED_HOME/.zshrc"; do
            # install.sh writes the expanded path, so match on that.
            if [ -f "$rc" ] && grep -qF "$ISOLATED_HOME/.local/bin" "$rc"; then
              echo "unexpected PATH export in $rc with AIAND_NO_MODIFY_PATH=1"
              exit 1
            fi
          done
      # Isolated-HOME installer behavior cases (allowlist, stage-fail, NO_COLOR, pwsh).
      - run: node scripts/install-behavior.mjs
  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Local-checkout path ($PSScriptRoot is the checkout, no GitHub clone).
      # AIAND_NO_MODIFY_PATH=1 keeps CI off the runner's real HKCU\Environment.
      - run: |
          $iso = Join-Path $env:RUNNER_TEMP 'aiand-install-home'
          New-Item -ItemType Directory -Path $iso | Out-Null
          $env:USERPROFILE = $iso
          $env:HOME = $iso
          $env:AIAND_NO_MODIFY_PATH = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/install.ps1"
          $expected = node -p "require('./package.json').version"
          $cmd = Join-Path $iso '.local\bin\aiand.cmd'
          $actual = (& $cmd --version | Out-String).Trim()
          if ($actual -ne $expected) { throw "aiand --version '$actual' != '$expected'" }
          $shim = Join-Path $iso '.local\bin\aiand'
          if (-not (Test-Path $shim)) { throw "Git Bash shim missing: $shim" }
          $bash = $null
          foreach ($p in @((Join-Path $env:ProgramFiles 'Git\bin\bash.exe'), $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'Git\bin\bash.exe' }))) {
            if ($p -and (Test-Path -LiteralPath $p)) { $bash = $p; break }
          }
          if (-not $bash) { throw "Git Bash is required to verify the Git Bash shim" }
          $actualShim = (& $bash $shim --version | Out-String).Trim()
          if ($actualShim -ne $expected) { throw "Git Bash shim --version '$actualShim' != '$expected'" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/install.ps1" uninstall --force
          if (Test-Path $cmd) { throw "uninstall left $cmd" }
          if (Test-Path $shim) { throw "uninstall left $shim" }
        shell: powershell
      # install.ps1 above built dist/ in this checkout (local-checkout path).
      # e2e.mjs runs the adapter matrix plus its win32 install.ps1 uninstall
      # cases, which no other job exercises.
      - run: node scripts/e2e.mjs
      # Real npm-installed OpenCode (an opencode.cmd shim on Windows) launched
      # through `aiand run-agent`, against the live gateway. Needs the key, so
      # same events as the live job.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm install -g opencode-ai@1.18.30
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'aiand-run-agent'
          New-Item -ItemType Directory -Path $state | Out-Null
          $env:AIAND_HOME = $state
          $env:AIAND_CONFIG_DIR = Join-Path $state 'cfg'
          $out = (node dist/index.js run-agent opencode -- --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "run-agent opencode exited $LASTEXITCODE" }
          if ($out -notmatch '\d+\.\d+\.\d+') { throw "unexpected opencode --version output: $out" }
          Write-Output "opencode via run-agent: $out"
        env:
          AIAND_API_KEY: ${{ secrets.AIAND_API_KEY }}
