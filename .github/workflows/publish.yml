name: Publish

# Two ways in, one build job, and a publish job for each:
#
# - A pushed `v<version>` tag that matches package.json, on a commit that is on
#   main (or on release/<major>.x for that major) and already passed CI, is a
#   stable release. It goes to npm as `latest` and gets a GitHub release, after
#   a reviewer approves the `release` environment.
#
#     node scripts/release.mjs tag   (or: git tag v0.2.0 && git push origin v0.2.0)
#
# - Every push to main, once CI passed on it, goes to npm as `next`, versioned
#   `<next patch>-next.<commit time>.g<sha>` (scripts/release.mjs next-version).
#   package.json is not changed in the repository. No approval: main takes a
#   reviewed pull request, and the `next` environment accepts only main.
#
# The build job holds no publish credential and writes nothing. It packs the
# tarball once and hands it on as an artifact, with its digests as job outputs.
# A publish job uploads that file and nothing else, and checks the digests first.
#
# All npm publishing lives in this one file because npm's trusted publishers
# name a workflow file: one entry for `publish.yml` + environment `release`,
# one for `publish.yml` + environment `next`.
on:
  push:
    tags: ["v*"]
    branches: [main]

permissions: {}

# Stable releases queue one at a time. `next` publishes have their own queue,
# where GitHub keeps only the newest waiting run, so a burst of merges
# publishes the last of them rather than each in turn.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'publish' || 'publish-next' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A `next` build waits for CI on its commit first.
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read # look up the CI run for the commit
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      sha512: ${{ steps.pack.outputs.sha512 }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the branch-ancestry check needs history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact, not `22`: a resumed run must not pack with a different Node than the
          # first, and a floating major moves without a commit here. Bump deliberately.
          node-version: 22.23.4
          # No registry-url: setup-node would write an .npmrc that reads a token
          # from NODE_AUTH_TOKEN, the one place a token could come back in.
          cache: npm
      - name: Check the tag, branch, CI, and npm
        id: check
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          # A release comes from main, or from release/<major>.x for its own
          # major (a fix to an older major after main moved on).
          MAINTENANCE="release/${VERSION%%.*}.x"
          git fetch --quiet origin main
          git fetch --quiet origin "$MAINTENANCE" 2>/dev/null || true
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            BRANCH=main
          elif git rev-parse --quiet --verify "origin/$MAINTENANCE" > /dev/null \
            && git merge-base --is-ancestor "$GITHUB_SHA" "origin/$MAINTENANCE"; then
            BRANCH="$MAINTENANCE"
          else
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main or $MAINTENANCE"
            exit 1
          fi
          CI="$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq 'length')"
          if [ "$CI" = "0" ]; then
            echo "::error::no successful CI run on $BRANCH for $GITHUB_SHA; wait for CI (or fix it) and re-push the tag"
            exit 1
          fi
          # The GitHub release is created after npm publish, from this section;
          # check it now so a missing one fails before anything is published.
          if ! node scripts/release.mjs notes "$VERSION" > /dev/null; then
            echo "::error::CHANGELOG.md has no [$VERSION] section; add it and re-push the tag"
            exit 1
          fi
          # A run can die after `npm publish` (npm slow to serve the version,
          # `gh release create` failing), and npm never lets a version be
          # published twice. So "already on npm" is a dead end only once the
          # GitHub release is out too; otherwise the publish job resumes.
          PUBLISHED="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,assets --jq '(.isDraft | not) and ([.assets[].name] | index("SHA256SUMS") != null)' 2>/dev/null || echo false)"
          if [ "$PUBLISHED" = "true" ]; then
            echo "::error::$TAG already has a published GitHub release with SHA256SUMS; bump package.json and tag the new version"
            exit 1
          fi
          # `latest`, unless npm's latest is already a newer major: then a fix
          # from release/<major>.x goes out as `latest-<major>`.
          NPM_LATEST="$(npm view @aiand/cli@latest version 2>/dev/null || true)"
          echo "dist-tag=$(node scripts/release.mjs dist-tag "$VERSION" "$NPM_LATEST")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # `next` publishes only what CI passed. CI starts on the same push, so
      # wait for it instead of failing: up to an hour, then give up (the next
      # merge publishes instead). A re-run of CI that passes counts.
      - name: Wait for CI on this commit
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            STATE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --json status,conclusion --jq 'if any(.[]; .conclusion == "success") then "success" elif length == 0 or any(.[]; .status != "completed") then "pending" else "failed" end')"
            case "$STATE" in
              success) echo "CI passed on $GITHUB_SHA."; exit 0 ;;
              failed)
                echo "::error::CI failed on $GITHUB_SHA, so it does not go to npm's next. Re-run CI, then this workflow, or let the next merge publish"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA did not finish within an hour; nothing was published"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Set the next version
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          VERSION="$(node scripts/release.mjs next-version)"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:public
      # Pack once. Both publish jobs take these bytes, so the SHA256SUMS on
      # the GitHub release hashes the very tarball npm serves.
      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TGZ="aiand-cli-$VERSION.tgz"
          OUT="$RUNNER_TEMP/build"
          mkdir -p "$OUT"
          npm pack --ignore-scripts --pack-destination "$OUT"
          test -f "$OUT/$TGZ"
          {
            echo "version=$VERSION"
            echo "tarball=$TGZ"
            echo "sha256=$(openssl dgst -sha256 -r "$OUT/$TGZ" | cut -d' ' -f1)"
            echo "sha512=$(openssl dgst -sha512 -binary "$OUT/$TGZ" | openssl base64 -A)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/build/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    timeout-minutes: 25
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC for trusted publishing, and npm provenance
    # What lets a person other than the one who pushed the tag decide whether
    # this run publishes. npm's trusted publishing does not look at the ref, so
    # without the environment, write access to this repository is all the
    # publish credential there is. These settings live outside this file, and
    # a release is only as controlled as they are (docs/adr/0001, "What has to
    # be set up outside this repository"):
    #   - GitHub environment `release`: required reviewers, and deployments
    #     limited to `v*` tags (no branches).
    #   - npm trusted publisher for @aiand/cli: this repository, workflow
    #     `publish.yml`, environment `release`.
    #   - A tag ruleset on `v*` (creation, update, and deletion restricted to
    #     the release maintainers).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # Node 22 bundles npm 10, which has no OIDC support at all. On npm 10 a
      # trusted-publishing publish goes out with no credential at all, and the
      # registry answers with a misleading 404 rather
      # than a 403. Trusted publishing needs npm 11.5.1 or newer, so install it
      # explicitly instead of inheriting whatever Node ships. Exact-pinned:
      # this binary later holds the OIDC publish credential, so bump it
      # deliberately.
      - name: Install an npm that speaks OIDC
        run: npm install -g npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/build
      - name: Check the artifact is the build job's tarball
        run: bash .github/scripts/check-artifact.sh "$RUNNER_TEMP/build" "$TGZ" "$SHA256" "$SHA512"
        env:
          TGZ: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          SHA512: ${{ needs.build.outputs.sha512 }}
      # npm never lets a version be published twice. A version already on npm
      # (the build job made sure its GitHub release is not complete) means an
      # earlier run died after `npm publish`: this run resumes. It publishes
      # nothing, checks that npm holds the very bytes the first run uploaded,
      # and creates the release.
      - name: Resume a run that already published
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "@aiand/cli@$VERSION" version 2>/dev/null || true)" ]; then
            echo "::warning::@aiand/cli@$VERSION is already on npm but $GITHUB_REF_NAME has no complete GitHub release: resuming without publishing"
            echo "RESUME=1" >> "$GITHUB_ENV"
          fi
      # Publish exactly the build job's bytes, so the SHA256SUMS attached to
      # the GitHub release below hashes the tarball npm serves. The installers
      # refuse a release whose npm tarball disagrees with either npm's sha512
      # or this file (docs/adr/0001-installers-verify-npm-release.md).
      #
      # A resumed run cannot rely on a fresh build reproducing a dead run's
      # bytes: the toolchain can move between runs. So the first run uploads
      # the tarball to the draft release, with the commit it was packed from,
      # BEFORE it publishes, and a resumed run (npm already has the version,
      # RESUME=1) takes those bytes from there instead. Only a resumed run
      # reuses an uploaded tarball, and the next step then requires npm to
      # serve exactly those bytes.
      #
      # A first run never reuses one: it takes the build job's tarball, and an
      # asset already on the release has to be byte-identical to it or the run
      # stops. Anyone with write access can create a draft release and attach
      # a file, so a name and a `packed-from` line in its notes prove nothing
      # about where the bytes came from.
      - name: Stage the release tarball and SHA256SUMS
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          TGZ="aiand-cli-$VERSION.tgz"
          BUILT="$RUNNER_TEMP/build"
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          MARK="packed-from: $GITHUB_SHA"
          HAVE_RELEASE=false
          HAVE_ASSET=false
          PACKED_FROM=""
          if [ ! -f "$BUILT/$TGZ" ]; then
            echo "::error::the build job's artifact holds no $TGZ"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            HAVE_RELEASE=true
            HAVE_ASSET="$(gh release view "$TAG" --json assets --jq "[.assets[].name] | index(\"$TGZ\") != null")"
            PACKED_FROM="$(gh release view "$TAG" --json body --jq '.body' | sed -n 's/^packed-from: //p' | head -n 1 | tr -d '\r')"
          fi
          if [ "${RESUME:-}" = "1" ]; then
            # npm already has this version. Take the bytes the first run
            # uploaded, if that run packed them from this very commit; the
            # npm check below still has to find them on the registry.
            if [ "$HAVE_ASSET" = "true" ]; then
              if [ "$PACKED_FROM" != "$GITHUB_SHA" ]; then
                echo "::error::npm already has @aiand/cli@$VERSION, packed from ${PACKED_FROM:-an unknown commit}, but $TAG now points at $GITHUB_SHA. The tag moved after the publish: do not retag, investigate first"
                exit 1
              fi
              echo "Resuming: reusing the tarball the first run uploaded to the $TAG release."
              gh release download "$TAG" --pattern "$TGZ" --dir "$OUT"
            else
              echo "::warning::npm already has this version but the release holds no tarball to reuse: taking this run's build. The check below still requires npm to serve exactly these bytes"
              cp "$BUILT/$TGZ" "$OUT/$TGZ"
            fi
          else
            cp "$BUILT/$TGZ" "$OUT/$TGZ"
            if [ "$HAVE_ASSET" = "true" ]; then
              # A leftover from an earlier run is fine when it is these bytes.
              EXISTING="$RUNNER_TEMP/existing"
              mkdir -p "$EXISTING"
              gh release download "$TAG" --pattern "$TGZ" --dir "$EXISTING"
              if ! cmp -s "$EXISTING/$TGZ" "$OUT/$TGZ"; then
                echo "::error::the $TAG release already holds $TGZ (sha512 $(openssl dgst -sha512 -r "$EXISTING/$TGZ" | cut -d' ' -f1)), which differs from what the build job packed (sha512 $(openssl dgst -sha512 -r "$OUT/$TGZ" | cut -d' ' -f1)). Nothing was published. Find out who attached it; if it is a leftover of an earlier run you trust, delete that asset from the draft release and re-run"
                exit 1
              fi
              echo "The $TAG release already holds this exact tarball."
            elif [ "$HAVE_RELEASE" = "true" ]; then
              # Before `npm publish`, so a run that dies after it can resume from these bytes.
              gh release upload "$TAG" "$OUT/$TGZ"
            else
              gh release create "$TAG" --verify-tag --draft --notes "$MARK" --title "$TAG" "$OUT/$TGZ"
            fi
            if [ "$HAVE_RELEASE" = "true" ]; then
              gh release edit "$TAG" --notes "$MARK"
            fi
          fi
          test -f "$OUT/$TGZ"
          cp install.sh install.ps1 "$OUT/"
          (cd "$OUT" && sha256sum "$TGZ" install.sh install.ps1 > SHA256SUMS)
          cat "$OUT/SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
      # npm authenticates this step over OIDC, through the trusted publisher
      # bound to this repository, publish.yml and the `release` environment.
      # No token is passed on purpose. This job already waits for the
      # environment's approval; the reason is that an npm token can publish
      # from anywhere, not only from this workflow, so the package disallows
      # tokens and nothing here should need one.
      #
      # Provenance is gated on visibility, not hardcoded. npm refuses to verify
      # an attestation from a private source repository, and it writes the
      # statement to the public Sigstore transparency log *before* the registry
      # rejects the upload — so passing the flag unconditionally burns a public
      # log entry on every failed run. Gating it means this publishes either way
      # and starts attesting on its own once the repository is public.
      - name: Publish to npm
        run: |
          TARBALL="$RUNNER_TEMP/release/aiand-cli-${GITHUB_REF_NAME#v}.tgz"
          if [ "${RESUME:-}" = "1" ]; then
            echo "Resuming: npm already has this version; not publishing again."
          elif [ "${{ github.event.repository.private }}" = "false" ]; then
            npm publish "$TARBALL" --tag "$DIST_TAG" --provenance --access public
          else
            echo "::warning::Source repository is private — publishing without provenance."
            npm publish "$TARBALL" --tag "$DIST_TAG" --access public
          fi
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
      # The release must not advertise a SHA256SUMS that npm's copy fails:
      # wait for the registry to serve this version and compare its sha512.
      # npm can take minutes to serve a fresh publish, so back off up to about
      # ten minutes (10, 20, 40, then 60 seconds apart). A resumed run holds
      # the same check: npm must serve the bytes this run staged.
      - name: Check npm serves the packed tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          WANT="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/release/aiand-cli-$VERSION.tgz" | base64 -w0)"
          DELAY=10
          ELAPSED=0
          while true; do
            GOT="$(npm view "@aiand/cli@$VERSION" dist.integrity 2>/dev/null || true)"
            if [ "$GOT" = "$WANT" ]; then exit 0; fi
            if [ -n "$GOT" ] && [ "${RESUME:-}" = "1" ]; then
              echo "::error::npm already holds a different tarball ($GOT) for @aiand/cli@$VERSION than this run staged ($WANT); the GitHub release was not created. Do not retag: investigate the difference first"
              exit 1
            fi
            if [ "$ELAPSED" -ge 600 ]; then break; fi
            sleep "$DELAY"
            ELAPSED=$((ELAPSED + DELAY))
            DELAY=$((DELAY * 2 > 60 ? 60 : DELAY * 2))
          done
          echo "::error::npm lists ${GOT:-nothing} for @aiand/cli@$VERSION, expected $WANT after ${ELAPSED}s; the GitHub release was not created. Re-run this workflow: it resumes without publishing again"
          exit 1
      # Release notes are the version's CHANGELOG section, not generated ones.
      # SHA256SUMS is what the installers verify against. install.sh and
      # install.ps1 ride along because the README one-liners fetch them from
      # releases/latest/download/, so a push to main cannot change what a new
      # install runs (the bootstrap is still GitHub alone: the ADR's
      # "trusted on first use").
      #
      # The release is created as a draft and published once every asset is
      # attached, so `releases/latest` never serves one without SHA256SUMS. A
      # re-run after a failure here finds the leftover release and completes it.
      # Publishing a draft publishes everything on it, and anyone with write
      # access can attach to one, so the draft is published only when it holds
      # exactly the four assets this workflow attached (the tarball above, the
      # three here) and nothing else. A fix to an older major (npm dist-tag
      # `latest-<major>`) is not marked as GitHub's latest release either.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ASSETS=("$RUNNER_TEMP/release/SHA256SUMS" "$RUNNER_TEMP/release/install.sh" "$RUNNER_TEMP/release/install.ps1")
          EXPECTED=("aiand-cli-${TAG#v}.tgz" SHA256SUMS install.sh install.ps1)
          LATEST=false
          if [ "${DIST_TAG:-latest}" = "latest" ]; then LATEST=true; fi
          node scripts/release.mjs notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --draft --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG" "${ASSETS[@]}"
          fi
          HAVE="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          EXTRA=""
          MISSING=""
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case " ${EXPECTED[*]} " in
              *" $name "*) ;;
              *) EXTRA="$EXTRA $(printf '%q' "$name")" ;;
            esac
          done <<< "$HAVE"
          for name in "${EXPECTED[@]}"; do
            printf '%s\n' "$HAVE" | grep -qxF -- "$name" || MISSING="$MISSING $name"
          done
          if [ -n "$EXTRA" ] || [ -n "$MISSING" ]; then
            if [ -n "$EXTRA" ]; then
              echo "::error::the $TAG release holds assets this workflow did not attach:$EXTRA. Nothing was published. Find out who attached them, remove each from the draft release (gh release delete-asset $TAG <name>), and re-run"
            fi
            if [ -n "$MISSING" ]; then
              echo "::error::the $TAG release is missing$MISSING. Nothing was published. Re-run this workflow so the missing asset is attached"
            fi
            exit 1
          fi
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG" --draft=false --latest="$LATEST"
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}

  # Every push to main that passed CI. The `next` environment is what npm's
  # second trusted publisher names, and it lets only main deploy, so a branch
  # that edits this file still cannot publish. It has no required reviewers:
  # main itself takes a reviewed pull request, and an approval on every merge
  # would be one nobody reads. These settings live outside this file:
  #   - GitHub environment `next`: deployment branches limited to `main`, no
  #     tags, no required reviewers.
  #   - npm trusted publisher for @aiand/cli: this repository, workflow
  #     `publish.yml`, environment `next` (beside the `release` entry).
  publish-next:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    timeout-minutes: 25
    permissions:
      contents: write # move the rolling `next` GitHub prerelease
      id-token: write # OIDC for trusted publishing, and npm provenance
    environment: next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # See the stable job: npm 10 cannot publish over OIDC.
      - name: Install an npm that speaks OIDC
        run: npm install -g npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/build
      - name: Check the artifact is the build job's tarball
        run: bash .github/scripts/check-artifact.sh "$RUNNER_TEMP/build" "$TGZ" "$SHA256" "$SHA512"
        env:
          TGZ: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          SHA512: ${{ needs.build.outputs.sha512 }}
      # The version comes from the commit, so a re-run asks for the same one:
      # already on npm means an earlier run got this far, and the check below
      # still requires npm to hold exactly these bytes. A run for an older
      # commit (a late re-run) never moves `next` backwards.
      - name: Publish to npm under next
        id: publish
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/build/$TGZ"
          CURRENT="$(npm view @aiand/cli@next version 2>/dev/null || true)"
          if [ -n "$(npm view "@aiand/cli@$VERSION" version 2>/dev/null || true)" ]; then
            echo "::warning::@aiand/cli@$VERSION is already on npm: not publishing it again"
          elif [ -n "$CURRENT" ] && node scripts/release.mjs is-newer "$CURRENT" "$VERSION"; then
            echo "::notice::npm's next is already $CURRENT, newer than $VERSION: nothing to publish"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.repository.private }}" = "false" ]; then
            npm publish "$TARBALL" --tag next --provenance --access public
          else
            echo "::warning::Source repository is private — publishing without provenance."
            npm publish "$TARBALL" --tag next --access public
          fi
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TGZ: ${{ needs.build.outputs.tarball }}
      - name: Check npm serves the packed tarball
        if: steps.publish.outputs.skip != '1'
        run: |
          set -euo pipefail
          WANT="sha512-$SHA512"
          DELAY=10
          ELAPSED=0
          while true; do
            GOT="$(npm view "@aiand/cli@$VERSION" dist.integrity 2>/dev/null || true)"
            if [ "$GOT" = "$WANT" ]; then exit 0; fi
            if [ -n "$GOT" ]; then
              echo "::error::npm holds a different tarball ($GOT) for @aiand/cli@$VERSION than the build job packed ($WANT); the next release on GitHub was left as it was"
              exit 1
            fi
            if [ "$ELAPSED" -ge 600 ]; then break; fi
            sleep "$DELAY"
            ELAPSED=$((ELAPSED + DELAY))
            DELAY=$((DELAY * 2 > 60 ? 60 : DELAY * 2))
          done
          echo "::error::npm lists nothing for @aiand/cli@$VERSION after ${ELAPSED}s; the next release on GitHub was left as it was. Re-run this job"
          exit 1
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA512: ${{ needs.build.outputs.sha512 }}
      # `install.sh --channel next` reads releases/download/next/SHA256SUMS
      # and requires npm's tarball to match it, the same two-party check as a
      # stable install. So the `next` prerelease on GitHub carries one
      # SHA256SUMS naming the build npm calls `next`, and its tag follows main.
      # It is updated only after npm serves these bytes, and only while npm's
      # next is this build. A prerelease is never `releases/latest`.
      - name: Point the next prerelease at this build
        if: steps.publish.outputs.skip != '1'
        run: |
          set -euo pipefail
          NEXT="$(npm view @aiand/cli@next version 2>/dev/null || true)"
          if [ "$NEXT" != "$VERSION" ]; then
            echo "::notice::npm's next is ${NEXT:-unset}, not $VERSION: leaving the next prerelease as it is"
            exit 0
          fi
          (cd "$RUNNER_TEMP/build" && sha256sum "$TGZ" > "$RUNNER_TEMP/SHA256SUMS")
          cat "$RUNNER_TEMP/SHA256SUMS"
          printf '%s\n' \
            "Builds of main, published to npm as @aiand/cli@next. Not a release: see the latest release for that." \
            "" \
            "version: $VERSION" \
            "packed-from: $GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/next" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/next" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          fi
          if gh release view next -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload next "$RUNNER_TEMP/SHA256SUMS" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit next -R "$GITHUB_REPOSITORY" --title next --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          else
            gh release create next -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title next --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false "$RUNNER_TEMP/SHA256SUMS"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TGZ: ${{ needs.build.outputs.tarball }}
