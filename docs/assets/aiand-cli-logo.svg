<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2115" height="580" viewBox="0 0 2115 580" fill="none" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">ai&amp; CLI</title>
  <desc id="logo-description">Red and graphite terminal prompt, the original ai&amp; company wordmark, and lowercase cli. Transparent background. Every visible glyph is a vector path.</desc>
  <metadata>Official ai&amp; letterforms reproduced without alteration from https://framerusercontent.com/images/041gd8KnkRP18huS35DduhDoG2s.svg . The standalone company emblem is omitted. The official wordmark is translated only; its path geometry, relative spacing, proportions and fill are preserved. CLI letterforms are custom monospaced vector outlines, matching the approved concept. Terminal artwork uses original editable paths and gradients.</metadata>
